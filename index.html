<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Syue & Lynn 旅遊足跡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Noto+Serif+TC:wght@400;500&display=swap" rel="stylesheet">
  <!-- Three.js 改為點擊 360° 才動態載入，加快首頁速度 -->
  <style>
    :root{--bg:#0f1410;--surface:#1a1f1b;--surface2:#222820;--border:#2e352c;--text:#e8e4dc;--muted:#8a9088;--accent:#7eb87a;--accent2:#c4a35a;--radius:12px;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Noto Serif TC',serif;background:var(--bg);color:var(--text);line-height:1.8;}
    nav{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 2.5rem;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;background:rgba(15,20,16,0.92);backdrop-filter:blur(12px);}
    .nav-logo{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--accent2);}
    .nav-links{display:flex;gap:2rem;}
    .nav-links a{font-size:13px;color:var(--muted);text-decoration:none;letter-spacing:0.1em;text-transform:uppercase;}
    .nav-links a:hover{color:var(--text);}
    .nav-menu-deco{display:none;} /* 桌機不顯示 */
    .hero{padding:6rem 2.5rem 5rem;text-align:center;border-bottom:1px solid var(--border);position:relative;overflow:hidden;min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
    /* 輪播背景 */
    .hero-bg{position:absolute;inset:0;z-index:0;}
    .hero-slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.5s ease;will-change:opacity;}
    .hero-slide.active{opacity:1;}
    .hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom, rgba(10,15,10,.55) 0%, rgba(10,15,10,.7) 60%, rgba(10,15,10,.92) 100%);}
    /* Hero 文字浮在背景上 */
    .hero > *:not(.hero-bg){position:relative;z-index:1;}
    /* 輪播指示點 */
    .hero-dots{position:absolute;bottom:.85rem;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:2;}
    .hero-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.25);cursor:pointer;transition:all .35s;border:none;padding:0;flex-shrink:0;}
    .hero-dot.active{background:rgba(255,255,255,.85);width:14px;border-radius:3px;}
    .hero-eyebrow{font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--accent);margin-bottom:1.25rem;}
    .hero h1{font-family:'Playfair Display',serif;font-size:52px;font-weight:700;line-height:1.2;margin-bottom:1.25rem;}
    .hero p{font-size:16px;color:var(--muted);}
    .social-section{padding:2rem 2.5rem;max-width:960px;margin:0 auto;border-bottom:1px solid var(--border);}
    .social-title{font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-bottom:1rem;}
    .social-links{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;}
    .social-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;color:var(--muted);text-decoration:none;background:var(--surface);transition:all 0.15s;}
    .social-btn:hover{border-color:var(--accent);color:var(--text);}
    .social-btn.fb:hover{border-color:#1877f2;color:#1877f2;}
    .social-btn.ig:hover{border-color:#e1306c;color:#e1306c;}
    .social-btn.line:hover{border-color:#00c300;color:#00c300;}
    .qr-block{display:inline-block;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);}
    .qr-block img{width:110px;height:110px;border-radius:6px;display:block;}
    .qr-label{font-size:11px;color:var(--muted);text-align:center;margin-top:6px;}
    .section{padding:4rem 2.5rem;max-width:960px;margin:0 auto;}
    .section-header{display:flex;align-items:baseline;gap:1rem;margin-bottom:2rem;}
    .section-eyebrow{font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--accent);white-space:nowrap;}
    .section h2{font-family:'Playfair Display',serif;font-size:32px;font-weight:500;}
    .section-line{flex:1;height:1px;background:var(--border);margin-left:1rem;}
    hr.divider{border:none;border-top:1px solid var(--border);}
    .search-wrap{position:relative;margin-bottom:1rem;}
    .search-wrap input{width:100%;padding:10px 40px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-size:14px;color:var(--text);font-family:inherit;outline:none;}
    .search-wrap input:focus{border-color:var(--accent);}
    .search-wrap input::placeholder{color:var(--muted);}
    .s-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--muted);pointer-events:none;}
    .s-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;display:none;}
    .s-clear.show{display:block;}
    .filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:1.75rem;flex-wrap:wrap;}
    .filter-tag{font-size:12px;padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap;font-family:inherit;}
    .filter-tag:hover{border-color:var(--accent);color:var(--accent);}
    .filter-tag.active{background:var(--accent);color:#0f1410;border-color:var(--accent);font-weight:500;}
    .filter-tag.gold:hover{border-color:var(--accent2);color:var(--accent2);}
    .filter-tag.gold.active{background:var(--accent2);border-color:var(--accent2);}
    .filter-select{font-size:12px;padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);cursor:pointer;outline:none;font-family:inherit;}
    .filter-count{font-size:12px;color:var(--muted);margin-left:auto;}
    /* ── Card ── */
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:border-color .2s,transform .2s,box-shadow .2s;display:flex;flex-direction:column;}
    .card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,.3);}
    .card-img{width:100%;height:220px;object-fit:cover;display:block;flex-shrink:0;}
    @media(max-width:768px){.card-img{height:180px;}}
    .card-body{padding:1.5rem;flex:1;display:flex;flex-direction:column;}
    .card-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:500;margin-bottom:6px;}
    .card-meta{font-size:12px;color:var(--muted);margin-bottom:0.75rem;}
    .card-tags{display:block;margin-bottom:0.75rem;line-height:2;}
    .badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;margin-right:6px;margin-bottom:4px;}
    .badge-green{background:rgba(126,184,122,0.12);color:var(--accent);border:1px solid rgba(126,184,122,0.25);}
    .badge-gold{background:rgba(196,163,90,0.12);color:var(--accent2);border:1px solid rgba(196,163,90,0.25);}
    .card-hint{margin-top:auto;font-size:11px;color:#4a5448;letter-spacing:.08em;padding-top:.75rem;}
    /* ── Card Modal ── */
    .cmodal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity .25s;}
    .cmodal-overlay.open{opacity:1;pointer-events:auto;}
    .cmodal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:680px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;transform:translateY(20px);transition:transform .25s;position:relative;}
    .cmodal-overlay.open .cmodal{transform:translateY(0);}
    body.pano-fullscreen-active .cmodal-overlay{padding:0;align-items:stretch;justify-content:stretch;background:#000;}
    body.pano-fullscreen-active .cmodal{width:100vw;max-width:none;height:100dvh;max-height:none;border:0;border-radius:0;overflow:visible;transform:none!important;background:#000;}
    body.pano-fullscreen-active .cmodal-scroll{overflow:visible;}
    body.pano-fullscreen-active .cmodal-close{display:none;}
    /* 關閉按鈕固定在右上角，不會隨捲動消失 */
    .cmodal-close{position:absolute;top:12px;right:12px;z-index:10;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.5);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;transition:all .15s;backdrop-filter:blur(6px);}
    .cmodal-close:hover{background:rgba(0,0,0,.75);border-color:rgba(255,255,255,.5);}
    /* 整個內容區域可以捲動，包含圖片 */
    .cmodal-scroll{overflow-y:auto;flex:1;}
    .cmodal-img{width:100%;height:280px;object-fit:cover;display:block;}
    @media(max-width:600px){.cmodal-img{height:200px;}}
    .cmodal-hdr{padding:1.5rem 1.5rem .75rem;}
    .cmodal-title{font-family:'Playfair Display',serif;font-size:24px;font-weight:500;margin-bottom:4px;}
    .cmodal-meta{font-size:12px;color:var(--muted);}
    .cmodal-tags{padding:0 1.5rem .75rem;}
    .cmodal-body{padding:0 1.5rem 1.5rem;}
    .cmodal-divider{height:1px;background:var(--border);margin-bottom:1.25rem;}
    .desc-block{margin-bottom:1.1rem;}
    .desc-title{font-size:13px;font-weight:600;letter-spacing:0.05em;margin-bottom:0.4rem;}
    .desc-text{font-size:14px;color:var(--muted);line-height:1.8;white-space:pre-line;}
    /* Inline 360° viewer（操作介面與傳送點樣式由 pano-tools.js 注入）*/
    .pano-wrap{position:relative;width:100%;aspect-ratio:16/10;min-height:280px;max-height:72vh;margin-top:1.25rem;border-radius:12px;overflow:hidden;background:#0a0f0a;isolation:isolate;box-shadow:0 10px 30px rgba(0,0,0,.25);}
    @supports not (aspect-ratio:1){.pano-wrap,.pano-placeholder{height:380px;}}
    .pano-wrap.pano-fs{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;max-height:none;min-height:0;aspect-ratio:auto;margin:0;border-radius:0;z-index:9999;box-shadow:none;}
    .pano-wrap:fullscreen{width:100vw;height:100vh;max-height:none;aspect-ratio:auto;margin:0;border-radius:0;}
    .pano-wrap:-webkit-full-screen{width:100vw;height:100vh;max-height:none;margin:0;border-radius:0;}
    .pano-error{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:2rem;text-align:center;color:#c9c4b8;font-size:13px;line-height:1.7;}
    /* 360° 封面：點擊後才載入 3D，節省流量 */
    .pano-placeholder{position:relative;width:100%;aspect-ratio:16/10;min-height:280px;max-height:72vh;margin-top:1.25rem;border-radius:12px;overflow:hidden;isolation:isolate;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;background:#121812;border:1px solid var(--border);transition:border-color .25s,box-shadow .25s;outline:none;}
    .pano-placeholder:hover,.pano-placeholder:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px rgba(126,184,122,.18);}
    .pano-placeholder.gold:hover,.pano-placeholder.gold:focus-visible{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(196,163,90,.18);}
    .pano-ph-bg{position:absolute;inset:-6%;z-index:-2;background:radial-gradient(120% 90% at 50% 40%,#22301f,#0b100c 75%) center/cover no-repeat;filter:brightness(.55) saturate(1.1);animation:pano-drift 24s ease-in-out infinite alternate;}
    .pano-placeholder::after{content:'';position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 30%,rgba(0,0,0,.55) 100%);}
    .pano-ph-badge{position:absolute;top:12px;left:12px;padding:5px 10px;border-radius:999px;font:700 11px/1 -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.14em;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
    .pano-ph-orb{position:relative;width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 12px 34px rgba(0,0,0,.45);transition:transform .3s cubic-bezier(.3,1.4,.5,1),background .3s;}
    .pano-ph-orb::before{content:'';position:absolute;inset:-7px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);animation:pano-ring 2.4s ease-out infinite;}
    .pano-ph-orb svg{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
    .pano-placeholder:hover .pano-ph-orb{transform:scale(1.08);background:rgba(126,184,122,.35);}
    .pano-placeholder.gold:hover .pano-ph-orb{background:rgba(196,163,90,.35);}
    .pano-ph-title{font-size:16px;font-weight:500;letter-spacing:.08em;text-shadow:0 2px 12px rgba(0,0,0,.6);}
    .pano-ph-sub{font-size:12px;color:rgba(255,255,255,.75);letter-spacing:.05em;text-shadow:0 1px 8px rgba(0,0,0,.6);}
    @keyframes pano-drift{from{transform:translateX(-3%) scale(1.04);}to{transform:translateX(3%) scale(1.04);}}
    @keyframes pano-ring{0%{transform:scale(.92);opacity:.8;}100%{transform:scale(1.35);opacity:0;}}
    @media(prefers-reduced-motion:reduce){.pano-ph-bg,.pano-ph-orb::before{animation:none;}}
    .yt-wrap{border-radius:8px;overflow:hidden;margin-top:1.25rem;margin-bottom:0.25rem;position:relative;padding-bottom:56.25%;height:0;}
    .yt-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;display:block;}
    .yt-caption{font-size:11px;color:var(--muted);text-align:center;letter-spacing:0.08em;margin-bottom:0.5rem;}
    .ig-embed-wrap{margin-top:1.25rem;padding:1rem;border:1px solid rgba(225,48,108,0.22);border-radius:10px;background:rgba(225,48,108,0.045);}
    .ig-embed-label{display:flex;align-items:center;gap:8px;margin-bottom:0.75rem;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#e1306c;}
    .ig-embed-wrap .instagram-media{min-width:0!important;width:100%!important;max-width:540px!important;margin:0 auto!important;border-radius:8px!important;overflow:hidden;}
    .ig-fallback{display:inline-flex;align-items:center;gap:7px;margin-top:0.8rem;font-size:12px;color:#e1306c;text-decoration:none;text-underline-offset:3px;}
    .ig-fallback:hover{text-decoration:underline;}
    .card-expand-img{width:100%;max-height:320px;object-fit:cover;border-radius:8px;margin-bottom:1rem;display:block;}
    .card-expand-placeholder{width:100%;height:180px;background:var(--surface2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);margin-bottom:1rem;}
    .card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.5rem;}
    .hl{background:rgba(126,184,122,0.3);border-radius:2px;padding:0 2px;}
    .hl.gold{background:rgba(196,163,90,0.3);}
    .empty-msg{font-size:14px;color:var(--muted);padding:3rem;text-align:center;border:1px dashed var(--border);border-radius:var(--radius);}
    .loading{text-align:center;padding:3rem;font-size:13px;color:var(--muted);}
    footer{padding:3rem 2.5rem;text-align:center;font-size:12px;color:var(--muted);border-top:1px solid var(--border);}

    /* ── Hamburger Menu ── */
    .nav-toggle{display:none;flex-direction:column;gap:5px;cursor:pointer;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 10px;transition:background .2s;}
    .nav-toggle:active{background:rgba(255,255,255,.12);}
    .nav-toggle span{width:20px;height:1.5px;background:var(--muted);border-radius:2px;transition:all .28s cubic-bezier(.4,0,.2,1);}
    .nav-toggle.open span:nth-child(1){transform:rotate(45deg) translate(4.5px,4.5px);}
    .nav-toggle.open span:nth-child(2){opacity:0;transform:scaleX(0);}
    .nav-toggle.open span:nth-child(3){transform:rotate(-45deg) translate(4.5px,-4.5px);}

    /* ── RWD 768px ── */
    @media(max-width:768px){
      .card-grid{grid-template-columns:1fr;}
      .section{padding:3rem 1.25rem;}
      .hero h1{font-size:38px;}
      .hero{min-height:360px;padding:4rem 1.5rem 4rem;}
      .cmodal-img{height:220px;}
      .cmodal{max-height:95vh;border-radius:12px;}
    }

    /* ── RWD 600px (手機) ── */
    @media(max-width:600px){
      /* Nav */
      nav{padding:.75rem 1.25rem;position:fixed;top:0;left:0;right:0;z-index:100;height:54px;min-height:unset;}
      .nav-toggle{display:flex;}
      /* 預設隱藏，不佔任何空間 */
      .nav-links{
        display:flex !important;flex-direction:column;
        position:fixed;top:54px;left:0;right:0;
        background:rgba(6,10,6,.97);
        border-bottom:1px solid rgba(255,255,255,.08);
        z-index:99;
        max-height:0;overflow:hidden;
        transition:max-height .28s ease, box-shadow .28s ease;
        box-shadow:none;
      }
      .nav-links.open{
        max-height:300px;
        box-shadow:0 12px 36px rgba(0,0,0,.5);
      }
      .nav-links a{
        padding:.6rem 1.5rem;font-size:14px;letter-spacing:.04em;
        color:rgba(255,255,255,.6);
        border-bottom:1px solid rgba(255,255,255,.05);
        white-space:nowrap;
        transition:color .15s,background .15s;
      }
      .nav-links a:active{color:#c4a35a;background:rgba(255,255,255,.04);}
      .nav-links a:last-child{border-bottom:none;padding-bottom:.8rem;}
      .nav-menu-deco{display:none;}

      /* Hero */
      .hero{min-height:300px;padding:4.5rem 1.25rem 3rem;margin-top:54px;}
      .hero h1{font-size:32px;}
      .hero p{font-size:14px;}
      .hero-eyebrow{font-size:10px;}
      .hero-dots{bottom:1rem;}

      /* Sections */
      .section{padding:2.5rem 1rem;}
      .section h2{font-size:26px;}
      .social-section{padding:1.5rem 1rem;}

      /* Cards */
      .card-grid{grid-template-columns:1fr;gap:1rem;}
      .card-img{height:180px;}

      /* Modal */
      .cmodal-overlay{padding:.5rem;align-items:flex-end;}
      .cmodal{max-height:92vh;border-radius:16px 16px 0 0;}
      .cmodal-img{height:180px;}
      .cmodal-title{font-size:20px;}

      /* Filter */
      .filter-bar{gap:6px;}
      .filter-tag{font-size:11px;padding:4px 10px;}
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-logo">Syue &amp; Lynn</div>
    <div class="nav-links" id="nav-links">
      <div class="nav-menu-deco">Navigation</div>
      <a href="#moto" onclick="closeNav()">重機</a>
      <a href="#camping" onclick="closeNav()">露營</a>
      <a href="#domestic" onclick="closeNav()">國內旅遊</a>
      <a href="#overseas" onclick="closeNav()">國外旅遊</a>
    </div>
    <button class="nav-toggle" id="nav-toggle" aria-label="選單" onclick="toggleNav()">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <div class="hero" id="hero-section">
    <!-- 輪播背景 — 由後台社群設定管理 -->
    <div class="hero-bg" id="hero-bg">
      <div class="hero-slide active" style="background-image:url('網站封面照片/optimized/清邁-hero.jpg')"></div>
      <div class="hero-overlay"></div>
    </div>
    <!-- 文字內容 -->
    <div class="hero-eyebrow">Travel Journal</div>
    <h1>旅遊足跡</h1>
    <p>記錄我們騎過的山路、住過的營地、走過的城市<br>每一個地點都是一段故事</p>
    <!-- 輪播指示點 -->
    <div class="hero-dots" id="hero-dots"></div>
  </div>

  <div class="social-section" id="social-section" style="display:none;">
    <div class="social-title">Follow Us</div>
    <div class="social-links" id="social-links"></div>
  </div>

  <div id="data-update-status" role="status" hidden style="max-width:960px;margin:1rem auto;padding:0 1.25rem;color:var(--muted);font-size:13px;">
    <span id="data-update-message"></span>
    <button type="button" id="data-retry" onclick="init()" class="filter-tag">重新載入</button>
  </div>

  <div class="section" id="moto">
    <div class="section-header">
      <span class="section-eyebrow">Motorcycle</span>
      <h2>重機地點</h2>
      <div class="section-line"></div>
    </div>
    <div class="search-wrap">

  <script>
    // ── Hero 輪播（命名函式，方便 loadSocial 重新初始化）────────────────────
    var _heroTimer = null, _heroCur = 0;
    function initHeroSlideshow() {
      var slides = document.querySelectorAll('#hero-bg .hero-slide');
      var dotsEl = document.getElementById('hero-dots');
      if (!dotsEl) return;
      // 清除舊 timer + dots，重設 active
      if (_heroTimer) { clearInterval(_heroTimer); _heroTimer = null; }
      dotsEl.innerHTML = '';
      _heroCur = 0;
      if (!slides.length) return;
      slides.forEach(function(s,i){ s.classList.toggle('active', i===0); });
      // 建立 dots
      slides.forEach(function(_, i) {
        var d = document.createElement('button');
        d.className = 'hero-dot' + (i===0?' active':'');
        d.setAttribute('aria-label', '第'+(i+1)+'張');
        d.addEventListener('click', (function(idx){ return function(){ _heroGo(idx); }; })(i));
        dotsEl.appendChild(d);
      });
      function _heroGo(n) {
        var ss = document.querySelectorAll('#hero-bg .hero-slide');
        if (!ss.length) return;
        ss[_heroCur].classList.remove('active');
        if (dotsEl.children[_heroCur]) dotsEl.children[_heroCur].classList.remove('active');
        _heroCur = (n + ss.length) % ss.length;
        ss[_heroCur].classList.add('active');
        if (dotsEl.children[_heroCur]) dotsEl.children[_heroCur].classList.add('active');
      }
      _heroTimer = setInterval(function(){ _heroGo(_heroCur+1); }, 5000);
    }
    initHeroSlideshow();

    // ── Hamburger Nav ─────────────────────────────────────────────────────────
    function closeNav(){

      document.getElementById('nav-links').classList.remove('open');

    function toggleNav(){

    const API='https://script.google.com/macros/s/AKfycbzPguC2eh8JP1x1GAOaqodo9r4nb1BPEE4JayJoQxBF-31jZTLl02pIj1ADQ8SGyHxcDw/exec';
    let campingData=[],motoData=[],domesticData=[],overseasData=[];
    const state={camping:{tag:'全部',loc:'全部',kw:''},moto:{tag:'全部',loc:'全部',kw:''},domestic:{tag:'全部',loc:'全部',kw:''},overseas:{tag:'全部',loc:'全部',kw:''}};
    let cid=0;

    // ── 動態載入 Three.js（只在使用者點擊 360° 時才下載）──
    var _threeLoaded = false, _threeCallbacks = [];
    function loadThreeJS(cb) {
      if (window.THREE) { cb(); return; }
      _threeCallbacks.push(cb);
      if (_threeLoaded) return; // 已在載入中
      _threeLoaded = true;
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
      s.onload = function() { _threeCallbacks.forEach(function(f){f();}); _threeCallbacks=[]; };
      s.onerror = function() { _threeLoaded=false;s.remove();var callbacks=_threeCallbacks.splice(0);callbacks.forEach(function(f){f(new Error('3D 引擎載入失敗'));}); };
      document.head.appendChild(s);
    }

    // ── 分頁設定 ─────────────────────────────────────────────
    const PAGE_SIZE = 6; // 首頁每次顯示幾筆
    var pageState = { camping: PAGE_SIZE, moto: PAGE_SIZE, domestic: PAGE_SIZE, overseas: PAGE_SIZE };

    // ── 360° inline viewer（操作、轉場、傳送點與介面由 pano-tools.js 提供）──
    var _panoViewers = {}; // id → InlinePano instance

    function InlinePano(containerId, cfg, gold) {
      this.containerId = containerId;
      this.cfg = cfg || {};
      this.scenes = (this.cfg.scenes || []).filter(function(sc) { return sc && (sc.imageUrl || sc.tileBaseUrl); });
      this.gold = gold;
      this.currentIdx = -1;
      this.handlers = [];
      this.job = 0;
      this.w = 0; this.h = 0;
      this.dirty = true;
      this.visible = true;
      this.raf = null;
      this.isPseudoFs = false;
      this.hasTexture = false;
      this.walking = false;
      this.destroyed = false;
      this.init();
    }

    InlinePano.prototype.addHandler = function(target, type, fn, opts) {
      target.addEventListener(type, fn, opts);
      this.handlers.push({ target: target, type: type, fn: fn, opts: opts });
    };

    InlinePano.prototype.init = function() {
      var me = this;
      var wrap = me.wrap = document.getElementById(me.containerId);
      if (!wrap) return;
      wrap.className = 'pano-wrap' + (me.gold ? ' gold' : '');
      wrap.removeAttribute('style');
      wrap.innerHTML = '';
      if (!me.scenes.length) {
        wrap.innerHTML = '<div class="pano-error">⚠️ 這個環景還沒有可顯示的場景</div>';
        return;
      }

      var canvas = me.canvas = document.createElement('canvas');
      canvas.className = 'ptv-canvas';
      wrap.appendChild(canvas);
      var layer = document.createElement('div');
      wrap.appendChild(layer);

      // Three.js — 行動裝置使用低功耗設定避免閃退
      var isMobile = PanoTools.isMobile;
      try {
        me.renderer = new THREE.WebGLRenderer({
          canvas: canvas,
          antialias: !isMobile,
          powerPreference: isMobile ? 'low-power' : 'default',
          preserveDrawingBuffer: false
        });
        me.renderer.outputEncoding = THREE.sRGBEncoding;
        me.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2));
        me.camera = new THREE.PerspectiveCamera(75, 1, 0.1, 200);
        me.camera.rotation.order = 'YXZ';
        me.scene = new THREE.Scene();
        var seg = isMobile ? 48 : 64;
        me.mat = new THREE.MeshBasicMaterial({ side: THREE.BackSide, color: 0x020302 });
        me.sphere = new THREE.Mesh(new THREE.SphereGeometry(100, seg, Math.round(seg * 2 / 3)), me.mat);
        me.scene.add(me.sphere);
        // 切片模式：立方體 6 面各自貼圖（scale.x=-1 配合 BackSide 讓方向正確）
        me.cubeMats = Array.from({length:6}, function() {
          return new THREE.MeshBasicMaterial({ side: THREE.BackSide, color: 0x020302 });
        });
        me.cubeMesh = new THREE.Mesh(new THREE.BoxGeometry(200, 200, 200), me.cubeMats);
        me.cubeMesh.rotation.y = Math.PI;
        me.cubeMesh.scale.x = -1;
        me.cubeMesh.visible = false;
        me.scene.add(me.cubeMesh);
        me.texLoader = new THREE.TextureLoader();
        me.texLoader.crossOrigin = 'anonymous';
      } catch(e) {
        me.renderer = null;
        wrap.innerHTML = '<div class="pano-error">⚠️ 此瀏覽器不支援 WebGL，無法顯示 360° 環景</div>';
        return;
      }

      me.xfade = new PanoTools.Transition(wrap);
      me.loader = new PanoTools.Loader(wrap);
      me.ctl = PanoTools.controls(canvas, me.camera, {
        autoRotate: true,
        onInteract: function() { me.ui.hideHint(); },
        onReset: function() { me.resetView(true); }
      });
      me.hotspots = new PanoTools.HotspotLayer(layer, {
        onClick: function(hs, el) { me.followHotspot(hs, el); }
      });
      me.ui = new PanoTools.ViewerUI(wrap, {
        onSelect: function(i) { me.goScene(i, { mode: 'pick' }); },
        onReset: function() { me.resetView(true); },
        onZoom: function(f) { me.ctl.zoomBy(f); },
        autoRotate: true,
        onAuto: function() { var on = !me.ctl.isAutoRotate(); me.ctl.setAutoRotate(on); me.ui.setAuto(on); },
        gyro: PanoTools.gyroSupported(),
        onGyro: function() { me.toggleGyro(); },
        fullscreen: true,
        onFullscreen: function() { me.toggleFullscreen(); }
      });
      me.ui.setAuto(me.ctl.isAutoRotate());
      me.ui.setScenes(me.scenes, -1);

      // 行動裝置記憶體吃緊時 WebGL 可能被回收：恢復後重新載入目前場景
      me.addHandler(canvas, 'webglcontextlost', function(e) { e.preventDefault(); me.hasTexture = false; });
      me.addHandler(canvas, 'webglcontextrestored', function() { me.goScene(me.currentIdx, { mode: 'initial' }); });

      me.resize = function() {
        if (me.destroyed) return;
        var w = wrap.clientWidth, h = wrap.clientHeight;
        if (!w || !h || (w === me.w && h === me.h)) return;
        me.w = w; me.h = h;
        me.renderer.setSize(w, h, false);
        me.camera.aspect = w / h;
        me.camera.updateProjectionMatrix();
        me.ui.layout(w, h);
        me.dirty = true;
        me.wake();
      };
      if (window.ResizeObserver) { me.ro = new ResizeObserver(function() { me.resize(); }); me.ro.observe(wrap); }
      me.addHandler(window, 'resize', me.resize);
      me.addHandler(document, 'fullscreenchange', function() { me.syncFs(); });
      me.addHandler(document, 'webkitfullscreenchange', function() { me.syncFs(); });
      me.addHandler(document, 'keydown', function(e) { if (e.key === 'Escape' && me.isPseudoFs) me.setPseudoFs(false); });

      // 不在畫面內時暫停繪製（避免 iOS 多個 WebGL 同時運作而崩潰）
      me.frameFn = function(t) { me.frame(t); };
      me.observer = new IntersectionObserver(function(entries) {
        me.visible = entries[0].isIntersecting;
        if (me.visible) { me.dirty = true; me.wake(); }
      }, { threshold: 0.05 });
      me.observer.observe(wrap);
      me.resize();
      me.wake();

      var start = me.scenes.findIndex(function(sc) { return sc.id === me.cfg.startScene; });
      me.goScene(start < 0 ? 0 : start, { mode: 'initial' });
    };

    InlinePano.prototype.wake = function() {
      if (!this.destroyed && this.visible && !this.raf) this.raf = requestAnimationFrame(this.frameFn);
    };

    // 只有視角變動時才重新繪製，省電也更順
    InlinePano.prototype.frame = function(t) {
      var me = this;
      me.raf = null;
      if (me.destroyed || !me.visible) return;
      me.raf = requestAnimationFrame(me.frameFn);
      if (me.ctl.update(t) || me.dirty) me.draw();
    };

    InlinePano.prototype.draw = function() {
      var me = this, cam = me.camera;
      me.dirty = false;
      me.renderer.render(me.scene, cam);
      me.hotspots.update(cam, me.w, me.h);
      var hfov = 2 * Math.atan(Math.tan(cam.fov * Math.PI / 360) * cam.aspect);
      me.ui.compass(cam.rotation.y, hfov, me.currentHotspots);
    };

    // mode：initial（首次載入）、pick（選單切換：淡入淡出）、hotspot（走向傳送點：向前推進）
    InlinePano.prototype.goScene = function(idx, opts) {
      var me = this;
      opts = opts || {};
      if (me.destroyed || !me.renderer || !me.scenes.length) return Promise.resolve(false);
      idx = Math.max(0, Math.min(me.scenes.length - 1, idx));
      var sc = me.scenes[idx], job = ++me.job;
      var target = opts.view || PanoTools.view(sc.initialView);
      if (me.hasTexture && opts.mode !== 'initial') {
        me.renderer.render(me.scene, me.camera);
        me.xfade.capture(me.canvas);
      }
      me.currentIdx = idx;
      me.ui.setCurrent(idx);
      me.hotspots.clear();
      me.currentHotspots = null;
      me.loader.show(sc.name || '360° 環景', '準備載入…', me.xfade.active ? 300 : 0);
      var waitTimer = setTimeout(function() { if (job === me.job) me.xfade.wait(); }, 280);
      var loading = sc.tileBaseUrl ? me.loadTiles(sc, job) : me.loadImage(sc, job);
      return loading.then(function(apply) {
        clearTimeout(waitTimer);
        if (job !== me.job || me.destroyed) return false;
        apply();
        me.hasTexture = true;
        me.canvas.style.filter = PanoTools.filter(sc.adjust);
        if (opts.arrive) {
          // 從稍微放大的畫面拉開，搭配舊畫面向前推進，營造「走過去」的感覺
          me.ctl.setView({ yaw: target.yaw, pitch: target.pitch, fov: Math.min(100, target.fov * 0.8) }, target);
          me.ctl.animateTo({ fov: target.fov }, 1000, PanoTools.ease.out);
        } else {
          me.ctl.setView(target);
        }
        me.ctl.update();
        me.currentHotspots = sc.hotspots || [];
        me.hotspots.set(me.currentHotspots);
        me.draw();
        me.loader.hide();
        me.xfade.leave(opts.mode === 'hotspot' ? 'forward' : 'fade');
        me.prefetchNeighbors(sc);
        if (opts.mode === 'initial') me.showHint();
        return true;
      }, function(err) {
        clearTimeout(waitTimer);
        if (job !== me.job || me.destroyed) return false;
        me.xfade.clear();
        me.clearTextures();
        me.dirty = true;
        var timeout = err && err.message === 'timeout';
        me.loader.error(timeout ? '圖片下載逾時' : '圖片載入失敗', function() { me.goScene(idx, { mode: 'pick' }); });
        return false;
      });
    };

    // 下載（含進度）→ 背景解碼 → 回傳「套用貼圖」的函式，讓轉場時機可控
    InlinePano.prototype.loadImage = function(sc, job) {
      var me = this;
      return PanoTools.images.load(sc.imageUrl, {
        maxSize: PanoTools.maxTextureSize(me.renderer),
        onProgress: function(loaded, total) {
          if (job === me.job) me.loader.progress(total ? loaded / total : null, loaded, total);
        }
      }).then(function(source) {
        return function() {
          var tex = PanoTools.panoTexture(source, me.renderer);
          me.clearCubeTextures();
          me.cubeMesh.visible = false;
          me.sphere.visible = true;
          if (me.mat.map) me.mat.map.dispose();
          me.mat.map = tex;
          me.mat.color.set(0xffffff);
          me.mat.needsUpdate = true;
        };
      });
    };

    InlinePano.prototype.loadTiles = function(sc, job) {
      var me = this, base = sc.tileBaseUrl.replace(/\/?$/, '/'), tex = [], done = 0, failed = 0, settled = false;
      return new Promise(function(resolve, reject) {
        var timer = setTimeout(function() { finish(new Error('timeout')); }, 30000);
        function finish(err, apply) {
          if (settled) return;
          settled = true; clearTimeout(timer);
          if (err) { tex.forEach(function(t) { if (t) t.dispose(); }); reject(err); }
          else resolve(apply);
        }
        function next() {
          done++;
          if (job === me.job) me.loader.progress(done / 6);
          if (done < 6) return;
          if (job !== me.job) return finish(new Error('stale'));
          if (failed === 6) return finish(new Error('tiles'));
          finish(null, function() {
            if (me.mat.map) { me.mat.map.dispose(); me.mat.map = null; me.mat.needsUpdate = true; }
            me.sphere.visible = false;
            me.cubeMesh.visible = true;
            me.cubeMats.forEach(function(m, i) {
              var t = tex[i];
              if (m.map) m.map.dispose();
              if (t) {
                t.encoding = THREE.sRGBEncoding;
                if (PanoTools.isMobile) { t.minFilter = THREE.LinearFilter; t.generateMipmaps = false; }
              }
              m.map = t || null;
              m.color.set(t ? 0xffffff : 0x020302);
              m.needsUpdate = true;
            });
          });
        }
        ['px','nx','py','ny','pz','nz'].forEach(function(face, i) {
          me.texLoader.load(base + face + '.jpg', function(t) {
            if (settled) { t.dispose(); return; }
            tex[i] = t; next();
          }, undefined, function() { if (!settled) { failed++; next(); } });
        });
      });
    };

    // 點傳送點：先轉向並靠近，再切到下一個場景
    InlinePano.prototype.followHotspot = function(hs, el) {
      var me = this;
      if (me.walking) return;
      var idx = me.scenes.findIndex(function(s) { return s.id === hs.targetScene; });
      if (idx < 0 || idx === me.currentIdx) return;
      var target = me.scenes[idx], from = me.scenes[me.currentIdx];
      if (target.imageUrl) PanoTools.images.prefetch(target.imageUrl, true);
      if (el) el.classList.add('ptv-hs-go');
      me.walking = true;
      var fov = me.ctl.getView().fov;
      me.ctl.animateTo({
        yaw: PanoTools.yawToward(hs.theta),
        pitch: PanoTools.pitchToward(hs.phi) * 0.5,
        fov: Math.max(30, fov * 0.7)
      }, 560).then(function() {
        return me.goScene(idx, { mode: 'hotspot', arrive: true, view: PanoTools.arrivalView(target, from && from.id) });
      }).then(function() { me.walking = false; }, function() { me.walking = false; });
    };

    // 背景預載相鄰場景，點下一個傳送點時幾乎不用等
    InlinePano.prototype.prefetchNeighbors = function(sc) {
      var me = this, seen = {}, count = 0, max = PanoTools.isMobile ? 1 : 3;
      (sc.hotspots || []).forEach(function(h) {
        if (count >= max) return;
        var t = me.scenes.find(function(s) { return s.id === h.targetScene; });
        if (!t || !t.imageUrl || seen[t.imageUrl]) return;
        seen[t.imageUrl] = true; count++;
        PanoTools.images.prefetch(t.imageUrl);
      });
    };

    InlinePano.prototype.resetView = function(animated) {
      var sc = this.scenes[this.currentIdx];
      if (!sc || !this.ctl) return;
      var v = PanoTools.view(sc.initialView);
      if (animated) this.ctl.animateTo(v, 700); else this.ctl.setView(v);
    };

    InlinePano.prototype.showHint = function() {
      try { if (sessionStorage.getItem('ptv-hint-seen')) return; sessionStorage.setItem('ptv-hint-seen', '1'); } catch(e) {}
      var touch = PanoTools.isTouch;
      var hasHs = this.scenes.some(function(s) { return s.hotspots && s.hotspots.length; });
      this.ui.showHint(touch ? '手指滑動，環顧四周' : '按住拖曳，環顧四周',
        (touch ? '雙指縮放・點兩下放大' : '滾輪縮放・點兩下放大') + (hasHs ? '・點圓形箭頭走到下一區' : ''), 5000);
    };

    InlinePano.prototype.toggleGyro = function() {
      var me = this, enable = !me.ctl.isGyro();
      me.ctl.setGyro(enable).then(function(ok) {
        if (me.destroyed) return;
        me.ui.setGyro(ok);
        if (enable && !ok) me.ui.toast('無法啟用陀螺儀，請允許瀏覽器存取「動作與方向」');
        else if (ok) me.ui.toast('轉動手機即可環顧四周');
      });
    };

    // 全螢幕：iPhone 不支援元素全螢幕，改用固定定位的「偽全螢幕」
    InlinePano.prototype.toggleFullscreen = function() {
      var me = this, wrap = me.wrap;
      var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
      if (me.isPseudoFs) { me.setPseudoFs(false); return; }
      if (fsEl) {
        var exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit) exit.call(document);
        return;
      }
      var req = wrap.requestFullscreen || wrap.webkitRequestFullscreen;
      if (!req || /iPhone|iPod/i.test(navigator.userAgent)) { me.setPseudoFs(true); return; }
      try {
        var r = req.call(wrap);
        if (r && r.catch) r.catch(function() { me.setPseudoFs(true); });
      } catch(e) { me.setPseudoFs(true); }
    };

    InlinePano.prototype.setPseudoFs = function(on) {
      this.isPseudoFs = !!on;
      this.syncFs();
    };

    InlinePano.prototype.syncFs = function() {
      var me = this;
      if (me.destroyed || !me.ui) return;
      var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
      var inFs = fsEl === me.wrap || me.isPseudoFs;
      me.wrap.classList.toggle('pano-fs', me.isPseudoFs);
      me.wrap.classList.toggle('is-fs', inFs);
      document.body.classList.toggle('pano-fullscreen-active', inFs);
      me.ui.setFullscreen(inFs);
      setTimeout(function() { me.resize(); }, 80);
    };

    InlinePano.prototype.clearCubeTextures = function() {
      (this.cubeMats || []).forEach(function(m) {
        if (m.map) { m.map.dispose(); m.map = null; }
        m.color.set(0x020302);
        m.needsUpdate = true;
      });
    };

    InlinePano.prototype.clearTextures = function() {
      if (this.mat && this.mat.map) {
        this.mat.map.dispose(); this.mat.map = null;
        this.mat.color.set(0x020302); this.mat.needsUpdate = true;
      }
      this.clearCubeTextures();
      this.hasTexture = false;
    };

    InlinePano.prototype.destroy = function() {
      var me = this;
      if (me.destroyed) return;
      me.destroyed = true;
      me.job++;
      if (me.raf) { cancelAnimationFrame(me.raf); me.raf = null; }
      if (me.observer) { try { me.observer.disconnect(); } catch(e) {} me.observer = null; }
      if (me.ro) { try { me.ro.disconnect(); } catch(e) {} me.ro = null; }
      if (me.ctl) me.ctl.dispose();
      if (me.ui) me.ui.destroy();
      PanoTools.images.cancel();
      document.body.classList.remove('pano-fullscreen-active');
      var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
      if (fsEl && fsEl === me.wrap) {
        var exit = document.exitFullscreen || document.webkitExitFullscreen;
        try { if (exit) exit.call(document); } catch(e) {}
      }
      me.handlers.forEach(function(h) {
        try { h.target.removeEventListener(h.type, h.fn, h.opts); } catch(e) {}
      });
      me.handlers = [];
      if (!me.renderer) return;
      me.clearTextures();
      if (me.mat) me.mat.dispose();
      if (me.sphere) me.sphere.geometry.dispose();
      if (me.cubeMats) me.cubeMats.forEach(function(m) { m.dispose(); });
      if (me.cubeMesh) me.cubeMesh.geometry.dispose();
      try { me.renderer.dispose(); } catch(e) {}
      try {
        var gl = me.renderer.getContext();
        var ext = gl && gl.getExtension('WEBGL_lose_context');
        if (ext) ext.loseContext();
      } catch(e) {}
    };

    // ── HTML escape（防止表單資料中的 HTML 被當成程式碼執行）──
    function esc(t){
      return String(t==null?'':t).replace(/[&<>"']/g,function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    }

    function hl(t,kw,g){
      var safe=esc(t);
      if(!kw||!safe)return safe;
      var pat=esc(kw).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      return safe.replace(new RegExp(pat,'gi'),function(m){return'<span class="hl'+(g?' gold':'')+'">'+m+'</span>';});
    }

    function matchKw(p,kw){
      if(!kw)return true;
      const q=kw.toLowerCase();
      if(['name','location','date','tags'].some(function(k){return(p[k]||'').toLowerCase().includes(q);}))return true;
      return plainText(p.desc||'').toLowerCase().includes(q);
    }

    function dataFor(type){
      if(type==='camping')return campingData;
      if(type==='moto')return motoData;
      if(type==='domestic')return domesticData;
      if(type==='overseas')return overseasData;
      return [];
    }
    function getFiltered(type){
      const list=dataFor(type);
      const s=state[type];
      return list.filter(function(p){
        const tagOk=s.tag==='全部'||(p.tags&&p.tags.split(',').map(function(t){return t.trim();}).includes(s.tag));
        const locOk=s.loc==='全部'||(p.location&&p.location.includes(s.loc));
        return tagOk&&locOk&&matchKw(p,s.kw);
      });
    }

    function plainText(desc){
      if(!desc)return'';
      if(desc.includes('|||')||desc.startsWith('{"')){
        var t='';desc.split('|||').forEach(function(p){try{var o=JSON.parse(p);t+=(o.text||'')+' ';}catch(e){t+=p+' ';}});return t.trim();
      }
      return desc;
    }

    function renderFull(desc,kw,g){
      if(!desc)return'';
      var ac=g?'var(--accent2)':'var(--accent)';
      if(desc.includes('|||')||desc.startsWith('{"')){
        return desc.split('|||').map(function(p){
          try{var o=JSON.parse(p);return'<div class="desc-block">'+(o.title?'<div class="desc-title" style="color:'+ac+'">'+hl(o.title,kw,g)+'</div>':'')+(o.text?'<div class="desc-text">'+hl(o.text,kw,g)+'</div>':'')+'</div>';}
          catch(e){return p.trim()?'<div class="desc-block"><div class="desc-text">'+hl(p,kw,g)+'</div></div>':'';}
        }).join('');
      }
      if(desc.indexOf('\n') >= 0 || desc.indexOf('【') >= 0){
        return desc.split(/\n{2,}/).map(function(block){
          block = block.trim();
          if(!block) return '';
          var lines = block.split('\n');
          var first = lines[0].trim();
          var isTitle = /^【[^】]+】$/.test(first);
          if(isTitle){
            var body = lines.slice(1).join('\n').trim();
            return '<div class="desc-block"><div class="desc-title" style="color:'+ac+'">'+hl(first,kw,g)+'</div>'+(body?'<div class="desc-text">'+hl(body,kw,g)+'</div>':'')+'</div>';
          }
          return '<div class="desc-block"><div class="desc-text">'+hl(block,kw,g)+'</div></div>';
        }).join('');
      }
      var hasEmoji=/\ud83c[\ud000-\udfff]|\ud83d[\ud000-\udfff]|\ud83e[\ud000-\udfff]|[\u2600-\u27ff]/.test(desc);
      if(hasEmoji){
        var parts=desc.split(/(?=\ud83c[\ud000-\udfff]|\ud83d[\ud000-\udfff]|\ud83e[\ud000-\udfff]|[\u2600-\u27ff])/).filter(function(s){return s.trim();});
        if(parts.length>1){
          return parts.map(function(seg){
            seg=seg.trim();if(!seg)return'';
            var bi=seg.indexOf('\u3011');
            var sp=bi>0?bi+1:seg.search(/\s{2}/);
            var title=sp>0?seg.slice(0,sp).trim():seg.split('\n')[0];
            var body=sp>0?seg.slice(sp).trim():'';
            return'<div class="desc-block"><div class="desc-title" style="color:'+ac+'">'+hl(title,kw,g)+'</div>'+(body?'<div class="desc-text">'+hl(body,kw,g)+'</div>':'')+'</div>';
          }).join('');
        }
      }
      return'<div class="desc-text">'+hl(desc,kw,g)+'</div>';
    }

    var _cardData={};

    function openCardModal(id){
      var d=_cardData[id]; if(!d) return;
      document.body.style.overflow='hidden';
      var ov=document.getElementById('cmodal-overlay');
      var img=document.getElementById('cmodal-img');
      if(d.img){img.src=d.img;img.style.display='block';}
      else{img.style.display='none';}
      document.getElementById('cmodal-title').textContent=d.name||'';
      var meta=(d.location||'')+(d.date?' · '+d.date:'');
      document.getElementById('cmodal-meta').textContent=meta;
      document.getElementById('cmodal-tags').innerHTML=d.tags||'';
      document.getElementById('cmodal-content').innerHTML=d.expand||'';
      ov.classList.add('open');
      if(d.hasInstagram) setTimeout(processInstagramEmbeds, 80);
      document.body.style.overflow='hidden';
    }

    function closeCardModal(e){
      if(e && e.target!==document.getElementById('cmodal-overlay')) return;
      var ov=document.getElementById('cmodal-overlay');
      ov.classList.remove('open');
      // 延遲清除 overflow 避免手機閃動
      setTimeout(function(){ document.body.style.overflow=''; }, 50);
      // 清掉 360° viewer 避免記憶體洩漏
      var content=document.getElementById('cmodal-content');
      content.querySelectorAll('.pano-wrap').forEach(function(wrap){
        var viewer = _panoViewers[wrap.id];
        if (viewer) {
          viewer.destroy();
          delete _panoViewers[wrap.id];
        } else {
          var c = wrap.querySelector('canvas');
          try{ var gl=c&&c.getContext('webgl'); if(gl) gl.getExtension('WEBGL_lose_context') && gl.getExtension('WEBGL_lose_context').loseContext(); }catch(e){}
        }
      });
      content.querySelectorAll('iframe').forEach(function(frame){
        try { frame.src = 'about:blank'; } catch(e) {}
      });
      setTimeout(function(){
        if (!ov.classList.contains('open')) {
          content.innerHTML = '';
          var img = document.getElementById('cmodal-img');
          if (img) { img.removeAttribute('src'); img.style.display = 'none'; }
        }
      }, 260);
    }

    function filterId(type){return{camping:'camp-filter-bar',moto:'moto-filter-bar',domestic:'domestic-filter-bar',overseas:'overseas-filter-bar'}[type]||type+'-filter-bar';}
    function isGold(type){return type==='moto'||type==='overseas';}
    function buildFilter(type){
      var list=dataFor(type);
      var s=state[type];var g=isGold(type);
      var bid=filterId(type);
      var tagSet=new Set();list.forEach(function(p){if(p.tags)p.tags.split(',').forEach(function(t){if(t.trim())tagSet.add(t.trim());});});
      var tags=['全部'].concat(Array.from(tagSet));
      var locSet=new Set();list.forEach(function(p){if(p.location&&p.location.trim())locSet.add(p.location.trim());});
      var locs=Array.from(locSet);
      var count=getFiltered(type).length;
      document.getElementById(bid).innerHTML=
        tags.map(function(t){return'<button class="filter-tag'+(g?' gold':'')+(s.tag===t?' active':'')+'" onclick="setTag(\''+type+'\',\''+t.replace(/'/g,"\\'")+'\')">'+ t+'</button>';}).join('')+
        (locs.length?'<select class="filter-select" onchange="setLoc(\''+type+'\',this.value)"><option value="全部"'+(s.loc==='全部'?' selected':'')+'>所有地區</option>'+locs.map(function(l){return'<option value="'+l+'"'+(s.loc===l?' selected':'')+'>'+l+'</option>';}).join('')+'</select>':'')+
        '<span class="filter-count">'+count+' 個地點</span>';
    }

    function loadMore(type) {
      pageState[type] += PAGE_SIZE;
      render(type);
    }

    function setTag(t,tag){state[t].tag=tag;pageState[t]=PAGE_SIZE;buildFilter(t);render(t);}
    function setLoc(t,loc){state[t].loc=loc;pageState[t]=PAGE_SIZE;buildFilter(t);render(t);}
    function searchId(t){return{camping:'camp-search',moto:'moto-search',domestic:'domestic-search',overseas:'overseas-search'}[t]||t+'-search';}
    function clearId(t){return{camping:'camp-clear',moto:'moto-clear',domestic:'domestic-clear',overseas:'overseas-clear'}[t]||t+'-clear';}
    var _searchTimers={};
    function onSearch(t){
      // 即時更新清除按鈕，但列表重繪延遲 180ms（debounce），打字更順
      var kw=document.getElementById(searchId(t)).value.trim();
      document.getElementById(clearId(t)).className='s-clear'+(kw?' show':'');
      clearTimeout(_searchTimers[t]);
      _searchTimers[t]=setTimeout(function(){
        state[t].kw=kw;
        pageState[t]=PAGE_SIZE;buildFilter(t);render(t);
      },180);
    }
    function clearSearch(t){
      clearTimeout(_searchTimers[t]);
      document.getElementById(searchId(t)).value='';
      state[t].kw='';
      document.getElementById(clearId(t)).className='s-clear';
      pageState[t]=PAGE_SIZE;buildFilter(t);render(t);
    }

    function parseImgField(raw){
      if(!raw)return{img:'',youtube:'',ig:''};
      if(raw.charAt(0)==='{'){
        try{var o=JSON.parse(raw);return{img:o.img||'',youtube:o.youtube||'',ig:o.ig||''};}
        catch(e){}
      }
      return{img:raw,youtube:'',ig:''};
    }

    function youtubeEmbedUrl(url){
      if(!url||!url.trim())return null;
      url=url.trim();
      // youtu.be/XXXX
      var m=url.match(/youtu\.be\/([^?&\s/]+)/);
      if(m)return'https://www.youtube.com/embed/'+m[1];
      // watch?v=XXXX or &v=XXXX
      m=url.match(/[?&]v=([^&\s]+)/);
      if(m)return'https://www.youtube.com/embed/'+m[1];
      // already embed URL
      m=url.match(/youtube\.com\/embed\/([^?&\s]+)/);
      if(m)return'https://www.youtube.com/embed/'+m[1];
      // shorts
      m=url.match(/youtube\.com\/shorts\/([^?&\s]+)/);
      if(m)return'https://www.youtube.com/embed/'+m[1];
      return null;
    }

    function safeAttr(v){
      return String(v||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function cloudinaryImageUrl(url, width){
      if(!url || !/res\.cloudinary\.com\/[^/]+\/image\/upload\//.test(url)) return url || '';
      if(/\/image\/upload\/[^/]*(f_auto|q_auto|w_)\b/.test(url)) return url;
      width = width || 900;
      return url.replace('/image/upload/', '/image/upload/f_auto,q_auto,w_'+width+'/');
    }

    function localHeroImageUrl(url){
      if(!url) return '';
      var decoded = '';
      try { decoded = decodeURIComponent(url); } catch(e) { decoded = url; }
      var map = {
        'tqskv1xb7haikbcwc7jt.webp': '網站封面照片/tqskv1xb7haikbcwc7jt.webp',
        'gwivczkqi0i83wgglrdf.jpg': '網站封面照片/optimized/gwivczkqi0i83wgglrdf-hero.jpg',
        'bn5oxqxzl30upmridnx0.jpg': '網站封面照片/optimized/bn5oxqxzl30upmridnx0-hero.jpg',
        '清邁.jpg': '網站封面照片/optimized/清邁-hero.jpg',
        'IMG_4566.JPG': '網站封面照片/optimized/IMG_4566-hero.jpg'
      };
      for(var name in map){
        if(decoded.indexOf('/網站封面照片/'+name) !== -1 || decoded.slice(-name.length) === name) return map[name];
      }
      return url;
    }

    function displayImageUrl(url, width){
      return cloudinaryImageUrl(localHeroImageUrl(url), width);
    }

    function instagramPermalink(url){
      if(!url||!url.trim())return '';
      var u=url.trim().split('?')[0];
      if(!/^https:\/\/(www\.)?instagram\.com\/(p|reel|tv)\//.test(u)) return '';
      return u.endsWith('/') ? u : u + '/';
    }

    function instagramEmbedHtml(url){
      var permalink=instagramPermalink(url);
      if(!permalink) return '';
      var safe=safeAttr(permalink);
      return '<div class="ig-embed-wrap">'+
        '<div class="ig-embed-label"><span>📸</span><span>Instagram Preview</span></div>'+
        '<blockquote class="instagram-media" data-instgrm-permalink="'+safe+'" data-instgrm-version="14">'+
          '<a href="'+safe+'" target="_blank" rel="noopener">在 Instagram 查看這篇貼文</a>'+
        '</blockquote>'+
        '<a class="ig-fallback" href="'+safe+'" target="_blank" rel="noopener">開啟 Instagram 原始貼文 ↗</a>'+
      '</div>';
    }

    function processInstagramEmbeds(){
      if(window.instgrm && window.instgrm.Embeds){
        window.instgrm.Embeds.process();
        return;
      }
      if(document.getElementById('instagram-embed-js')) return;
      var s=document.createElement('script');
      s.id='instagram-embed-js';
      s.async=true;
      s.src='https://www.instagram.com/embed.js';
      document.body.appendChild(s);
    }

    function containerId(type){return{camping:'camping-container',moto:'moto-container',domestic:'domestic-container',overseas:'overseas-container'}[type]||type+'-container';}
    function render(type){
      var filtered=getFiltered(type);var kw=state[type].kw;var g=isGold(type);
      var el=document.getElementById(containerId(type));
      if(!filtered.length){el.innerHTML='<div class="empty-msg">找不到符合條件的地點</div>';return;}

      // 分頁：有搜尋/篩選時顯示全部；否則只顯示 pageState 筆數
      var isFiltering = (state[type].kw || state[type].tag !== '全部' || state[type].loc !== '全部');
      var showCount = isFiltering ? filtered.length : Math.min(pageState[type], filtered.length);
      var displayed = filtered.slice(0, showCount);

      var html=displayed.map(function(p){
        cid++;var id='c'+cid;
        var imgP=parseImgField(p.img||'');
        var cardImg=displayImageUrl(imgP.img,720);
        var modalImg=displayImageUrl(imgP.img,1200);
        var ytUrl=youtubeEmbedUrl(imgP.youtube||p.youtube||'');
        var igUrl=(imgP.ig||p.ig||'').trim();
        var descHtml=renderFull(p.desc,kw,g);
        // 第一層封面圖
        var thumbHtml=cardImg
          ?'<img class="card-img" src="'+safeAttr(cardImg)+'" alt="'+safeAttr(p.name)+'" loading="lazy" decoding="async" sizes="(max-width: 760px) 100vw, 460px">'
          :'';
        // 標籤
        var tagsHtml=p.tags
          ?'<div class="card-tags">'+p.tags.split(',').map(function(t){
              return'<span class="badge badge-'+(g?'gold':'green')+'">'+esc(t.trim())+'</span>';
            }).join('')+'</div>'
          :'';
        // 展開內容
        // 解析 pano360 欄位：支援圖片 / 切片資料夾 / config.json
        var pano360Html='';
        var panoRaw=(p.pano360||'').trim();
        if(panoRaw){
          var panoId='pano-'+id;
          var panoAttrs=' data-gold="'+g+'"';
          if(panoRaw.endsWith('/')){
            // 切片模式（tileBaseUrl）
            panoAttrs+=' data-tile-url="'+safeAttr(panoRaw)+'"';
          } else if(panoRaw.endsWith('.json')||panoRaw.includes('raw.githubusercontent.com')){
            // GitHub config.json
            panoAttrs+=' data-config-url="'+safeAttr(panoRaw)+'"';
          } else {
            // 直接圖片網址
            panoAttrs+=' data-image-url="'+safeAttr(panoRaw)+'"';
          }
          // 封面：用這趟旅程的照片當背景，緩慢平移暗示「可以環顧」
          var poster=cloudinaryImageUrl(imgP.img,1200);
          var openJs='initPano360AndReplace(\''+panoId+'\')';
          pano360Html='<div class="pano-placeholder'+(g?' gold':'')+'" id="'+panoId+'"'+panoAttrs+' role="button" tabindex="0" aria-label="載入 360° 互動環景"'+
            ' onclick="'+openJs+'" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();'+openJs+';}">'+
            '<div class="pano-ph-bg"'+(poster?' style="background-image:url(\''+safeAttr(poster).replace(/'/g,'%27')+'\')"':'')+'></div>'+
            '<span class="pano-ph-badge">360°</span>'+
            '<span class="pano-ph-orb">'+PanoTools.icon('globe')+'</span>'+
            '<span class="pano-ph-title">進入 360° 環景</span>'+
            '<span class="pano-ph-sub">拖曳環顧四周・點擊箭頭走訪各區</span>'+
          '</div>';
        }
        var hasExpand=!!(descHtml||pano360Html||ytUrl||igUrl);
        var expandHtml='';
        if(descHtml)expandHtml+=descHtml;
        if(pano360Html)expandHtml+=pano360Html;
        if(ytUrl)expandHtml+=
          '<div class="yt-wrap"><iframe src="'+ytUrl+'"'+
          ' allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture"'+
          ' allowfullscreen></iframe></div><p class="yt-caption">▶ YouTube 影片</p>';
        var igEmbed=instagramEmbedHtml(igUrl);
        if(igEmbed)expandHtml+=igEmbed;
        // 儲存展開內容供 modal 讀取
        _cardData[id]={name:p.name,location:p.location,date:p.date,img:modalImg,tags:tagsHtml,expand:expandHtml,gold:g,hasInstagram:!!igEmbed};
        var clickAttr=hasExpand?' onclick="openCardModal(\''+id+'\')" role="button" tabindex="0"':'';
        return'<div class="card"'+clickAttr+'>'+
          thumbHtml+
          '<div class="card-body">'+
            '<div class="card-title">'+hl(p.name,kw,g)+'</div>'+
            '<div class="card-meta">'+hl(p.location||'',kw,g)+(p.date?' · '+esc(p.date):'')+'</div>'+
            tagsHtml+
            (hasExpand?'<div class="card-hint">點擊查看詳情 →</div>':'')+
          '</div>'+
        '</div>';
      }).join('');
      el.innerHTML=html;

      // 「載入更多」按鈕
      if (!isFiltering && showCount < filtered.length) {
        var remaining = filtered.length - showCount;
        var btn = document.createElement('div');
        btn.style.cssText = 'text-align:center;padding:1.5rem 0 0.5rem;grid-column:1/-1;';
        btn.innerHTML = '<button onclick="loadMore(\''+type+'\')" style="padding:10px 32px;border:1px solid var(--border);border-radius:20px;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit;letter-spacing:0.05em;">載入更多（還有 '+remaining+' 個地點）</button>';
        el.appendChild(btn);
      }
    }

    function loadSocial(data){
      if(!data)return;
      var s;try{s=JSON.parse(data);}catch(e){return;}
      var links=[];
      if(s.fb)links.push('<a class="social-btn fb" href="'+s.fb+'" target="_blank"><span style="font-size:16px">📘</span>Facebook</a>');
      if(s.ig)links.push('<a class="social-btn ig" href="'+s.ig+'" target="_blank"><span style="font-size:16px">📸</span>Instagram</a>');
      if(s.line)links.push('<a class="social-btn line" href="'+s.line+'" target="_blank"><span style="font-size:16px">💬</span>Line 加好友</a>');
      if(s.lineQr)links.push('<div class="qr-block"><img src="'+s.lineQr+'" alt="Line QR"><div class="qr-label">掃描加入 Line</div></div>');
      if(links.length){document.getElementById('social-section').style.display='block';document.getElementById('social-links').innerHTML=links.join('');}

      // ── Hero 背景圖片 ─────────────────────────────────────────
      var heroImgs = s.heroImages;
      // heroImages 可能是陣列或逗號字串
      if(typeof heroImgs === 'string') heroImgs = heroImgs.split(',').map(function(u){return u.trim();}).filter(Boolean);
      if(heroImgs && heroImgs.length){
        var bg = document.getElementById('hero-bg');
        if(bg){
          var overlay = bg.querySelector('.hero-overlay');
          // 移除舊的 slides
          bg.querySelectorAll('.hero-slide').forEach(function(s){s.remove();});
          // 重建 slides
          heroImgs.slice(0,5).forEach(function(url,i){
            var displayUrl = displayImageUrl(url, 1600);
            if (i === 0) {
              var pre = new Image();
              pre.decoding = 'async';
              pre.src = displayUrl;
            }
            var slide = document.createElement('div');
            slide.className = 'hero-slide' + (i===0?' active':'');
            slide.style.backgroundImage = 'url("'+displayUrl.replace(/"/g, '%22')+'")';
            bg.insertBefore(slide, overlay);
          });
          // 重新初始化輪播
          initHeroSlideshow();
        }
      }
    }

    function initPano360AndReplace(id) {
      var wrap = document.getElementById(id);
      if (!wrap) return;
      // 先顯示「載入中」，再動態載入 Three.js
      var gold = wrap.dataset.gold === 'true';
      wrap.className = 'pano-wrap' + (gold ? ' gold' : '');
      ['style','onclick','onkeydown','role','tabindex','aria-label'].forEach(function(a){ wrap.removeAttribute(a); });
      wrap.onclick = null;
      wrap.innerHTML = '';
      var boot = new PanoTools.Loader(wrap);
      boot.show('360° 環景', '載入 3D 引擎…');
      loadThreeJS(function(err) {
        if(!wrap.isConnected)return;
        if(err){boot.error('3D 引擎載入失敗',function(){initPano360AndReplace(id);});return;}
        _doInitPano360(id, wrap, boot);
      });
    }

    function _doInitPano360(id, wrap, boot) {
      var configUrl = wrap.dataset.configUrl;
      var imageUrl  = wrap.dataset.imageUrl;
      var tileUrl   = wrap.dataset.tileUrl;
      var cfgRaw    = wrap.dataset.cfg;
      var gold      = wrap.dataset.gold === 'true';

      function startWithConfig(cfg) {
        if(!wrap.isConnected)return;
        if(!cfg || !Array.isArray(cfg.scenes) || !cfg.scenes.length)throw new Error('沒有可用場景');
        if (_panoViewers[id]) _panoViewers[id].destroy();
        _panoViewers[id] = new InlinePano(id, cfg, gold);
      }
      function fail(title, text) {
        if(wrap.isConnected) boot.error(title, function(){ initPano360AndReplace(id); }, text);
      }

      // 切片模式：自動建立單場景 config
      if (tileUrl) {
        startWithConfig({ scenes: [{ id:'s1', name:'360° 環景', tileBaseUrl: tileUrl, hotspots:[] }] });
      } else if (configUrl) {
        boot.show('360° 環景', '讀取場景設定…');
        // no-cache：後台更新設定後，前台立即看到新版（GitHub 有 ETag，未變更時很快）
        fetch(configUrl, { cache: 'no-cache' })
          .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
          .then(startWithConfig)
          .catch(function() { fail('無法載入環景設定', '請確認 GitHub URL 正確且 Repo 為 Public'); });
      } else if (cfgRaw) {
        try { startWithConfig(JSON.parse(decodeURIComponent(cfgRaw))); }
        catch(e) { fail('環景設定格式錯誤'); }
      } else if (imageUrl) {
        startWithConfig({ scenes: [{ id:'s1', name:'360° 環景', imageUrl: imageUrl, hotspots:[] }] });
      }
    }

    var ALL_TYPES = ['camping','moto','domestic','overseas'];
    var DATA_CACHE_KEY = 'syue_travel_data_v2';
    var _dataLoading = false;

    function validSiteData(data){
      return !!data && ALL_TYPES.concat('social').every(function(type){
        return Array.isArray(data[type]);
      });
    }

    function getCachedData(){
      try {
        var raw = localStorage.getItem(DATA_CACHE_KEY);
        if (!raw) return null;
        var c = JSON.parse(raw);
        if (!c || !validSiteData(c.data)) return null;
        return c;
      } catch(e) { return null; }
    }

    function saveCachedData(data){
      try { localStorage.setItem(DATA_CACHE_KEY, JSON.stringify({ time: Date.now(), data: data })); } catch(e) {}
    }

    function applySiteData(data){
      data = data || {};
      campingData = Array.isArray(data.camping) ? data.camping : [];
      motoData = Array.isArray(data.moto) ? data.moto : [];
      domesticData = Array.isArray(data.domestic) ? data.domestic : [];
      overseasData = Array.isArray(data.overseas) ? data.overseas : [];
      if (data.social && data.social[0] && data.social[0].data) loadSocial(data.social[0].data);
      ALL_TYPES.forEach(function(t){
        try { buildFilter(t); render(t); } catch(te) {
          var el=document.getElementById(containerId(t));
          if(el)el.innerHTML='<div class="empty-msg">顯示失敗（'+te.message+'）</div>';
        }
      });
    }

    function fetchSheet(sheet){
      return fetch(API+'?sheet='+sheet, { cache: 'no-store' })
        .then(function(r){
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function(data){
          if (!Array.isArray(data)) throw new Error('Invalid sheet data');
          return data;
        });
    }

    function fetchStaticData(){
      return fetch('data.json', { cache: 'default' })
        .then(function(r){
          if (!r.ok) throw new Error('data json unavailable');
          return r.json();
        }).then(function(data){
          if (!validSiteData(data)) throw new Error('Invalid static data');
          return data;
        });
    }

    function fetchFreshData(){
      return Promise.all([
        fetchSheet('camping'),
        fetchSheet('moto'),
        fetchSheet('social'),
        fetchSheet('domestic'),
        fetchSheet('overseas')
      ]).then(function(results){
        return {
          camping: results[0],
          moto: results[1],
          social: results[2],
          domestic: results[3],
          overseas: results[4]
        };
      });
    }

    async function init(){
      if (_dataLoading) return;
      _dataLoading = true;
      var status = document.getElementById('data-update-status');
      var retry = document.getElementById('data-retry');
      retry.disabled = true;
      status.hidden = true;
      var cached = getCachedData();
      if (cached) applySiteData(cached.data);

      if (!cached) {
        try {
          var staticData = await fetchStaticData();
          saveCachedData(staticData);
          applySiteData(staticData);
          cached = { time: Date.now(), data: staticData };
        } catch(e) {}
      }

      try{
        var fresh = await fetchFreshData();
        var freshStr = JSON.stringify(fresh);
        // 資料沒變就不重繪，避免畫面閃一下
        if (!cached || JSON.stringify(cached.data) !== freshStr) {
          applySiteData(fresh);
        }
        saveCachedData(fresh);
      }catch(e){
        document.getElementById('data-update-message').textContent = cached
          ? '暫時無法更新，已保留上次成功載入的內容，請稍後重試。 '
          : '暫時無法載入內容，請稍後重試。 ';
        status.hidden = false;
        if (!cached) {
          ALL_TYPES.forEach(function(t){
            var el=document.getElementById(containerId(t));
            if(el)el.innerHTML='<div class="empty-msg">載入失敗，請重新整理</div>';
          });
        }
      }finally{
        _dataLoading = false;
        retry.disabled = false;
      }
    }
    init();
  </script>
</body>
